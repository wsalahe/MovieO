name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['catalog.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.waleed --project-name movieo build_app
          cp pubspec.yaml build_app/pubspec.yaml
          cp -r lib/. build_app/lib/
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' build_app/android/app/src/main/AndroidManifest.xml
      - name: Build
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build_app/build/app/outputs/flutter-apk/app-release.apk movieo.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest movieo.apk --title "movieo latest" --notes "Latest build"
